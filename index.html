<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Giveaway</title>

<style>
:root{
--bg:#0F172A;
--card:#1E293B;
--text:#F8FAFC;
--gold:#F59E0B;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#0F172A,#1E293B);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:var(--text);
overflow:hidden;
}

.container{
width:100%;
max-width:500px;
background:rgba(255,255,255,.06);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
padding:25px;
text-align:center;
box-shadow:0 20px 50px rgba(0,0,0,.4);
animation:fade .8s ease;
}

h1{
margin-bottom:12px;
}

.subtitle{
line-height:1.6;
opacity:.9;
}

.small{
margin-top:10px;
color:var(--gold);
font-size:.9rem;
}

.boxes{
display:flex;
gap:12px;
justify-content:center;
margin-top:30px;
}

.box{
width:100px;
height:120px;
border:none;
cursor:pointer;
border-radius:20px;
background:linear-gradient(145deg,#F59E0B,#FFC44D);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-size:2rem;
font-weight:bold;
box-shadow:
0 0 20px rgba(245,158,11,.6);
transition:.3s;
animation:bounce 2s infinite;
}

.box span{
font-size:.85rem;
margin-top:8px;
}

.box:hover{
transform:translateY(-6px);
}

.box.open{
transform:rotateY(180deg);
background:white;
color:#111;
}

.box.locked{
opacity:.3;
pointer-events:none;
}

.popup{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
visibility:hidden;
transition:.4s;
}

.popup.show{
opacity:1;
visibility:visible;
}

.popup-card{
background:#1E293B;
padding:30px;
border-radius:25px;
width:90%;
max-width:320px;
text-align:center;
box-shadow:0 20px 40px rgba(0,0,0,.4);
animation:pop .4s ease;
}

.popup h2{
margin-bottom:15px;
}

.reward{
color:var(--gold);
font-size:1.3rem;
font-weight:bold;
}

.footer{
position:fixed;
bottom:15px;
font-size:.85rem;
opacity:.8;
}

@keyframes bounce{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-8px)}
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes pop{
from{
transform:scale(.8);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}
</style>
</head>
<body>

<div class="container">
<h1>🎉 Selamat! 🎉</h1>

<p class="subtitle">
Kamu berhasil memenangkan giveaway ini.
Pilih satu kotak hadiah misteri di bawah dan lihat keberuntunganmu.
</p>

<p class="small">
Hadiah spesial untuk pemenang ❤️
</p>

<div class="boxes">
<button class="box" data-index="0">
🎁
<span>Kotak 1</span>
</button>

<button class="box" data-index="1">
🎁
<span>Kotak 2</span>
</button>

<button class="box" data-index="2">
🎁
<span>Kotak 3</span>
</button>
</div>
</div>

<div class="popup" id="popup">
<div class="popup-card">
<h2>🎉 Selamat! 🎉</h2>
<div class="reward" id="rewardText"></div>
<p style="margin-top:10px;">
Mengarahkan ke hadiah...
</p>
</div>
</div>

<div class="footer">
Dibuat khusus untuk giveaway ❤️
</div>

<script>
const hadiah = [
{
nominal:"Rp40.000",
link:"https://app.gopay.co.id/NF8p/iny40eum"
},
{
nominal:"Rp50.000",
link:"https://app.gopay.co.id/NF8p/f6i5ubzi"
},
{
nominal:"Rp60.000",
link:"https://app.gopay.co.id/NF8p/yj46lv87"
}
];

function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}
return arr;
}

const hadiahAcak = shuffle([...hadiah]);

const boxes = document.querySelectorAll(".box");
const popup = document.getElementById("popup");
const rewardText = document.getElementById("rewardText");

let sudahPilih = false;

boxes.forEach((box,index)=>{

box.addEventListener("click",()=>{

if(sudahPilih) return;

sudahPilih = true;

const reward = hadiahAcak[index];

box.classList.add("open");

boxes.forEach(other=>{
if(other!==box){
other.classList.add("locked");
}
});

rewardText.textContent =
`Kamu mendapatkan ${reward.nominal}`;

popup.classList.add("show");

setTimeout(()=>{
window.location.href = reward.link;
},2000);

});

});
</script>

</body>
</html>
